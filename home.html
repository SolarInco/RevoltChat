<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVOLT CHAT - Home</title>
    <script>
        const savedTheme = localStorage.getItem('revolt_theme');
        if (savedTheme && savedTheme !== 'default') {
            document.documentElement.className = `theme-${savedTheme}`;
            document.documentElement.style.backgroundColor = 'var(--bg-color)';
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            height: 100vh;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            color: var(--border-color);
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 50px;
            text-shadow: 0 0 15px var(--border-color), 3px 3px 0px #000;
            text-align: center;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .menu-grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
        }

        @keyframes float-icon {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s, color 0.2s;
            animation: float-icon 3s ease-in-out infinite;
        }

        .menu-item:nth-child(even) {
            animation-delay: 1.5s;
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .menu-item:hover .icon-circle {
            border-color: var(--border-color);
            box-shadow: 0 0 10px var(--border-color);
            transform: scale(1.1);
        }

        .menu-item:hover {
            color: var(--border-color);
        }

        .menu-item span {
            font-weight: bold;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="content-wrapper">
        <div class="title">Revolt Chat</div>

        <div class="menu-grid">
            <a href="html/chat.html" class="menu-item">
                <div class="icon-circle"><i data-lucide="message-square" size="32"></i></div>
                <span>Chat</span>
            </a>
            <a href="html/profile.html" class="menu-item">
                <div class="icon-circle"><i data-lucide="user" size="32"></i></div>
                <span>Profile</span>
            </a>
            <a href="html/friends.html" class="menu-item">
                <div class="icon-circle"><i data-lucide="users" size="32"></i></div>
                <span>Friends</span>
            </a>
            <a href="html/gems.html" class="menu-item">
                <div class="icon-circle"><i data-lucide="gem" size="32"></i></div>
                <span>Gems</span>
            </a>
            <a href="html/wallet.html" class="menu-item">
                <div class="icon-circle"><i data-lucide="wallet" size="32"></i></div>
                <span>Wallet</span>
            </a>
            <a href="html/accounts.html" class="menu-item">
                <div class="icon-circle"><i data-lucide="user-check" size="32"></i></div>
                <span>Accounts</span>
            </a>
            <a href="html/settings.html" class="menu-item">
                <div class="icon-circle"><i data-lucide="settings" size="32"></i></div>
                <span>Settings</span>
            </a>
            <a href="index.html" class="menu-item">
                <div class="icon-circle"><i data-lucide="log-out" size="32"></i></div>
                <span>Logout</span>
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="js/global.js"></script>
</body>
</html>
