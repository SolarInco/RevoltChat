<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVOLT CHAT - Home</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --title-color: #e60000;
            --border-color: #e60000;
            --header-bg: #0a0000;
            --neon-glow: 0 0 10px #e60000, inset 0 0 5px #e60000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            color: var(--title-color);
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 60px;
            text-shadow: var(--neon-glow);
        }

        .menu-grid {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }

        @keyframes float-icon {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: #3b3bff;
            transition: color 0.2s;
            animation: float-icon 3s ease-in-out infinite;
        }

        .menu-item:nth-child(even) {
            animation-delay: 1.5s;
        }

        .menu-item:hover {
            color: var(--title-color);
        }

        .menu-item span {
            color: var(--text-color);
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="title">REVOLT</div>

    <div class="menu-grid">
        <a href="html/chat.html" class="menu-item">
            <i data-lucide="message-square" size="50"></i>
            <span>Chat</span>
        </a>
        <a href="html/profile.html" class="menu-item">
            <i data-lucide="user" size="50"></i>
            <span>Profile</span>
        </a>
        <a href="html/friends.html" class="menu-item">
            <i data-lucide="users" size="50"></i>
            <span>Friends</span>
        </a>
        <a href="html/gems.html" class="menu-item">
            <i data-lucide="gem" size="50"></i>
            <span>Gems</span>
        </a>
        <a href="html/wallet.html" class="menu-item">
            <i data-lucide="wallet" size="50"></i>
            <span>Wallet</span>
        </a>
        <a href="html/settings.html" class="menu-item">
            <i data-lucide="settings" size="50"></i>
            <span>Settings</span>
        </a>
        <a href="index.html" class="menu-item">
            <i data-lucide="log-out" size="50"></i>
            <span>Logout</span>
        </a>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
