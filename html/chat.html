<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVOLT CHAT</title>
    <script>
        const savedTheme = localStorage.getItem('revolt_theme');
        if (savedTheme && savedTheme !== 'default') {
            document.documentElement.className = `theme-${savedTheme}`;
            document.documentElement.style.backgroundColor = 'var(--bg-color)';
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/chat.css">
    <style>
        .navbar {
            border-bottom: 1px solid var(--border-color);
            background: color-mix(in srgb, var(--bg-color) 80%, black);
        }

        .nav-title {
            color: var(--border-color);
            text-shadow: 0 0 5px var(--border-color);
        }

        .nav-mini-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            text-decoration: none;
            transition: all 0.2s ease;
            margin: 0 3px;
        }

        .nav-mini-icons a:hover {
            background: color-mix(in srgb, var(--border-color) 20%, transparent);
            box-shadow: 0 0 8px var(--border-color);
        }

        #side-panel, #right-panel {
            border: 1px solid var(--border-color);
            background: color-mix(in srgb, var(--bg-color) 90%, transparent);
            box-shadow: 0 0 10px color-mix(in srgb, var(--border-color) 15%, transparent);
        }

        #side-panel h2, #right-panel h2 {
            color: var(--border-color);
            border-bottom: 1px solid color-mix(in srgb, var(--border-color) 30%, transparent);
        }

        .room {
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 4px;
            transition: all 0.2s ease;
            color: var(--text-color);
            opacity: 0.7;
        }

        .room:hover {
            background: color-mix(in srgb, var(--border-color) 10%, transparent);
            opacity: 1;
        }

        .room.active {
            background-color: color-mix(in srgb, var(--border-color) 25%, transparent);
            color: var(--border-color) !important;
            font-weight: bold;
            border-left: 3px solid var(--border-color);
            opacity: 1;
        }

        #revolt-count-display {
            color: var(--border-color);
            font-weight: bold;
            text-shadow: 0 0 5px color-mix(in srgb, var(--border-color) 50%, transparent);
            padding: 10px 0;
        }

        #input-container {
            border-top: 1px solid var(--border-color);
        }

        #message-input {
            border: 1px solid var(--border-color);
            background: color-mix(in srgb, var(--bg-color) 70%, black);
            color: var(--text-color);
        }

        #message-input:focus {
            box-shadow: 0 0 5px var(--border-color);
            outline: none;
        }

        #send-button {
            background-color: var(--border-color);
            color: var(--bg-color);
            font-weight: bold;
            border: none;
        }

        #send-button:hover {
            box-shadow: 0 0 10px var(--border-color);
            filter: brightness(1.2);
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="navbar">
        <div class="nav-left">
            <a href="../home.html" class="back-btn" style="color: var(--border-color);">
                <i data-lucide="arrow-left" size="20"></i>
            </a>
            <div class="nav-title">REVOLT</div>
        </div>
        <div class="nav-mini-icons">
            <a href="profile.html"><i data-lucide="user" size="18"></i></a>
            <a href="friends.html"><i data-lucide="users" size="18"></i></a>
            <a href="gems.html"><i data-lucide="gem" size="18"></i></a>
            <a href="wallet.html"><i data-lucide="wallet" size="18"></i></a>
            <a href="accounts.html"><i data-lucide="user-check" size="18"></i></a>
            <a href="settings.html"><i data-lucide="settings" size="18"></i></a>
            <a href="#" id="logout-btn"><i data-lucide="log-out" size="18"></i></a>
        </div>
    </div>

    <div class="main-container">
        <div id="side-panel">
            <h2>Rooms</h2>
            <ul id="online-users-list" style="list-style: none; padding: 0;">
                <li class="room active" data-room="General">General</li>
                <li class="room" data-room="Gaming">Gaming</li>
                <li class="room" data-room="Yap">Yap</li>
                <li class="room" data-room="GOATS">GOATS</li>
                <li class="room" data-room="REVOLTERS">REVOLTERS</li>
            </ul>
        </div>

        <div id="chat-app">
            <div id="messages-container"></div>
            <form id="input-container">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit" id="send-button">Send</button>
            </form>
        </div>

        <div id="right-panel">
            <h2>Revolt Counter</h2>
            <div id="revolt-count-display">Total Users: <span id="user-count">0</span></div>
            <ul id="revolt-users-list"></ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="../js/chat.js"></script>
    <script type="module" src="../js/global.js"></script>
</body>
</html>
