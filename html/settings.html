<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revolt Chat - Settings</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/settings.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
    </div>
    
    <div id="particles-js"></div>
    <div class="wave-bg"></div>
    
    <div class="top-nav-area">
        <a href="../home.html" class="box-back-btn"><i data-lucide="arrow-left"></i></a>
    </div>

    <div class="page-container">
        <div class="settings-board">
            <h2>Settings</h2>

            <div class="setting-section">
                <h3>Select Theme</h3>
                <div class="theme-grid">
                    <div class="theme-box selected" data-theme="default">
                        <div class="theme-preview default-preview"></div>
                        <span>Default</span>
                    </div>
                    <div class="theme-box" data-theme="coral">
                        <div class="theme-preview coral-preview"></div>
                        <span>Coral</span>
                    </div>
                    <div class="theme-box" data-theme="darkgreen">
                        <div class="theme-preview darkgreen-preview"></div>
                        <span>Dark Green</span>
                    </div>
                    <div class="theme-box" data-theme="usa">
                        <div class="theme-preview usa-preview"></div>
                        <span>USA</span>
                    </div>
                    <div class="theme-box" data-theme="amber">
                        <div class="theme-preview amber-preview"></div>
                        <span>Amber</span>
                    </div>
                    <div class="theme-box" data-theme="lightgreen">
                        <div class="theme-preview lightgreen-preview"></div>
                        <span>Light Green</span>
                    </div>
                    <div class="theme-box" data-theme="rose">
                        <div class="theme-preview rose-preview"></div>
                        <span>Rose</span>
                    </div>
                </div>
            </div>

            <div class="setting-section">
                <h3>Background Effects</h3>
                <label class="toggle-container">
                    <span>Flurries / Particles</span>
                    <input type="checkbox" id="toggle-particles" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <button id="save-settings-btn" class="save-btn">Save Settings</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script type="module" src="../js/global.js"></script>
    <script type="module" src="../js/settings.js"></script>
    <script>
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
