<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <script>
        const savedTheme = localStorage.getItem('revolt_theme');
        if (savedTheme && savedTheme !== 'default') {
            document.documentElement.className = `theme-${savedTheme}`;
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            height: 100vh;
        }

        .settings-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 700px;
            background: color-mix(in srgb, var(--bg-color) 80%, black);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 15px color-mix(in srgb, var(--border-color) 40%, transparent);
        }

        h1 {
            color: var(--border-color);
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            color: var(--border-color);
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="settings-container">
        <a href="../home.html" class="back-btn"><i data-lucide="arrow-left"></i> Back</a>
        <h1>Themes</h1>
        
        <div class="theme-grid">
            <div class="theme-box" data-theme="default" style="background-color: #000000; border-color: #e60000; color: #e60000; box-shadow: 0 0 15px rgba(230, 0, 0, 0.5);">
                Default
            </div>
            <div class="theme-box" data-theme="dark-green" style="background-color: #021102; border-color: #008000; color: #008000; box-shadow: 0 0 15px rgba(0, 128, 0, 0.5);">
                Dark Green
            </div>
            <div class="theme-box" data-theme="light-green" style="background-color: #051a05; border-color: #32cd32; color: #32cd32; box-shadow: 0 0 15px rgba(50, 205, 50, 0.5);">
                Light Green
            </div>
            <div class="theme-box" data-theme="coral" style="background: linear-gradient(135deg, #87ceeb 33%, #ffffff 33%, #ffffff 66%, #001f3f 66%); border-color: #87ceeb; color: #001f3f; text-shadow: 0 0 8px #ffffff, 0 0 8px #ffffff; box-shadow: 0 0 15px rgba(135, 206, 235, 0.5);">
                Coral
            </div>
            <div class="theme-box" data-theme="usa" style="background: linear-gradient(135deg, #e62b2b 33%, #ffffff 33%, #ffffff 66%, #070b19 66%); border-color: #e62b2b; color: #070b19; text-shadow: 0 0 8px #ffffff, 0 0 8px #ffffff; box-shadow: 0 0 15px rgba(230, 43, 43, 0.5);">
                USA
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="../js/global.js"></script>
    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        
        const auth = getAuth();
        const db = getFirestore();

        document.querySelectorAll('.theme-box').forEach(box => {
            box.addEventListener('click', async () => {
                const theme = box.getAttribute('data-theme');
                localStorage.setItem('revolt_theme', theme);
                
                if (theme !== 'default') {
                    document.documentElement.className = `theme-${theme}`;
                } else {
                    document.documentElement.className = '';
                }

                if (auth.currentUser) {
                    const userRef = doc(db, "users", auth.currentUser.uid);
                    await updateDoc(userRef, { theme: theme });
                }

                location.reload();
            });
        });
    </script>
</body>
</html>
