<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <script>
        const savedTheme = localStorage.getItem('revolt_theme');
        if (savedTheme && savedTheme !== 'default') {
            document.documentElement.className = `theme-${savedTheme}`;
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            height: 100vh;
        }

        .settings-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 850px;
            background: color-mix(in srgb, var(--bg-color) 70%, #000000);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 0 20px color-mix(in srgb, var(--border-color) 40%, transparent);
            transition: all 0.3s ease;
        }

        h1 {
            color: var(--border-color);
            text-align: center;
            font-size: 2.8rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px color-mix(in srgb, var(--border-color) 50%, transparent);
            transition: color 0.3s ease;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            color: var(--border-color);
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="settings-container">
        <a href="../home.html" class="back-btn"><i data-lucide="arrow-left"></i> Back</a>
        <h1>Themes</h1>
        
        <div class="theme-grid">
            <div class="theme-box" data-theme="default" style="background-color: #050000; border-color: #ff0000; color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);">
                Revolt
            </div>
            <div class="theme-box" data-theme="blue" style="background-color: #000515; border-color: #007bff; color: #007bff; box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);">
                Blue
            </div>
            <div class="theme-box" data-theme="rose" style="background-color: #15000a; border-color: #ff007f; color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);">
                Rose
            </div>
            <div class="theme-box" data-theme="amber" style="background-color: #150600; border-color: #ff5e00; color: #ff5e00; box-shadow: 0 0 15px rgba(255, 94, 0, 0.5);">
                Amber
            </div>
            <div class="theme-box" data-theme="lightning" style="background-color: #151500; border-color: #ffe600; color: #ffe600; box-shadow: 0 0 15px rgba(255, 230, 0, 0.5);">
                Lightning
            </div>
            <div class="theme-box" data-theme="mystic" style="background: linear-gradient(135deg, #0a0015 40%, #2a005c 100%); border-color: #9d00ff; color: #df99ff; text-shadow: 0 0 5px #9d00ff; box-shadow: 0 0 15px rgba(157, 0, 255, 0.5);">
                Mystic
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="../js/global.js"></script>
    <script type="module">
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        
        const auth = getAuth();
        const db = getFirestore();

        document.querySelectorAll('.theme-box').forEach(box => {
            box.addEventListener('click', async () => {
                const theme = box.getAttribute('data-theme');
                localStorage.setItem('revolt_theme', theme);
                
                if (theme !== 'default') {
                    document.documentElement.className = `theme-${theme}`;
                } else {
                    document.documentElement.className = '';
                }

                if (auth.currentUser) {
                    const userRef = doc(db, "users", auth.currentUser.uid);
                    await updateDoc(userRef, { theme: theme });
                }

                location.reload();
            });
        });
    </script>
</body>
</html>
