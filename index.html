<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVOLT CHAT</title>
    <link rel="stylesheet" href="css/chat.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="side-panel">
        <div class="panel-header">
            <h2><i data-lucide="radio" class="icon-pulse"></i> Live: <span id="online-count">0</span></h2>
        </div>
        <ul id="online-users-list">
        </ul>
    </div>
    
    <div id="chat-app">
        <div id="header">
            <h1><i data-lucide="messages-square"></i> REVOLT CHAT</h1>
            <button id="logout-btn"><i data-lucide="log-out"></i></button>
        </div>
        <div id="messages-container"></div>
        <div id="input-container">
            <input type="text" id="message-input" placeholder="Type a message (max 30 chars)..." autocomplete="off" maxlength="30">
            <button id="send-button"><i data-lucide="send"></i></button>
        </div>
    </div>

    <script type="module" src="js/chat.js"></script>
</body>
</html>
