<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVOLT - Login & Signup</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <h1 id="auth-title">Sign Up</h1>
        <p id="auth-subtitle">Join Revolt chat and join the revolt, You're goated!.</p>
        
        <div class="form-group" id="username-group">
            <input type="text" id="username-input" placeholder="Username (max 12 chars)" maxlength="12" autocomplete="off">
        </div>
        <div class="form-group">
            <input type="email" id="email-input" placeholder="Email" autocomplete="off">
        </div>
        <div class="form-group">
            <input type="password" id="password-input" placeholder="Password (min 6 chars)">
        </div>
        
        <button id="auth-action-btn">Create Account = you're goated</button>
        <p id="auth-error" class="error-msg"></p>

        <p class="toggle-text">
            <span id="toggle-prompt">Already have an account? Good boy/girl</span> 
            <a href="#" id="toggle-mode">Why don't you have an account? Log in!</a>
        </p>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
